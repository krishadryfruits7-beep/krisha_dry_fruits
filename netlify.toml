[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_ADMIN_PASSKEY,ADMIN_SECRET,VITE_ADMIN_SECRET,CLERK_SECRET_KEY,CLOUDINARY_API_SECRET,MONGODB_URI"

[dev]
  command = "vite"
  port = 8888
  targetPort = 5173
  framework = "#custom"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mongoose"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200